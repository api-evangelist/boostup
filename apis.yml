aid: boostup
name: Boostup
description: >-
  Boostup (now operating as Terret, terret.ai) is an AI-powered revenue
  intelligence platform that connects data across a company's revenue systems to
  analyze sales performance, forecast pipeline, and translate insights into
  real-time execution guidance for sales teams. Its products include Terret Nexus
  (an answer-to-action revenue engine that generates playbooks), Terret Forecast
  (pipeline forecasting), and Terret Conversation Intelligence (call analysis).
  For developers, Boostup exposes a public REST data-export API at
  app.boostup.ai/export that lets customers programmatically pull their
  Opportunities, Accounts, and Forecast Submissions out of the platform for
  in-house analysis and reporting. The API is authenticated with API keys passed
  in the Authorization header, returns JSON paginated in batches of up to 1000
  records, and supports date-based filtering on close/create/update times. The
  company was surfaced as a portfolio company of Canaan Partners.
