note: >-
  Boostup / Terret publishes NO numeric rate limits. The Export API contract does
  declare exhaustion behaviour — every one of the three operations documents a
  429 "Too Many Requests" response carrying the ExceptionSchema `{detail: string}`
  envelope — but no quota, window, burst, or scope is stated anywhere, and no
  rate-limit response headers are documented. A full-text sweep of all 67
  published Zendesk help-center articles found no occurrence of "rate limit".
  The only throughput control the provider actually publishes is the page-size
  ceiling on the export filter body: `limit` is capped at 1000 records per
  request and `skip` is required, so a consumer paginates rather than requesting
  a large window at once.
  An agent calling this API therefore has a status-code signal (429) and no
  runtime header signal — it must back off blindly.
