authentication:
  style: api-key
  location: header
  parameter: Authorization
  notes: >-
    API key passed verbatim in the Authorization header (no Bearer prefix
    documented). Keys minted in the API Key Service portal at
    /settings/external-api-token. A key created by a user is deactivated when
    that user is deactivated. See authentication/boostup-authentication.yml.
pagination:
  style: limit-skip
  params:
    limit: required integer, max page size 1000
    skip: required integer offset
  response: batches of up to 1000 JSON records per request
  notes: limit and skip are required on every export filter body.
filtering:
  style: date-range
  fields:
    - created_date (start_date required, end_date optional)
    - closed_date (opportunities only)
    - updated_at
  plus:
    opportunity: []
    account: [email_domain, account_id]
    forecast_submission: [submission_type, business_type, forecast_name, year, quarter, month, week, period_type, user]
idempotency:
  supported: false
  notes: >-
    All three endpoints are read-only data exports (POST is used to carry the
    filter body, not to mutate state); there is no idempotency-key contract.
